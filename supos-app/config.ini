; FactoryMind AI — application configuration (open supOS app package).
;
; This mirrors spl-pl-distribution/config.ini. Runtime configuration for the
; engine is environment-driven (see the repository .env.example); this file
; documents the deployment-time knobs and is the fallback for a packaged run.
;
; Rules: no secrets here. Tokens and API keys arrive as environment variables
; at deploy time, never baked into the package.

[server]
; engine listen port (container-internal)
port=8100

[supos]
; attach to the hosting open supOS instance
enabled=true
base_url=
token=
; mock | supos
data_provider=mock

[ai]
; mock | openai-compatible | local
provider=mock
base_url=
model=

[MQTT]
; event ingestion (open supOS CE has no REST event endpoint; events are MQTT)
ENABLED=true
BROKER=emqx:1883
TOPIC=factorymind/uns/#
CLIENT_ID=factorymind-ai-engine
