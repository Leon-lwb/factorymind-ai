# FactoryMind AI web — nginx site config for the open supOS app package.
#
# Serves the built SPA and reverse-proxies `/api` to the engine container so the
# browser sees a single origin.
#
# Upstream host: supOS addresses a container as `<appName>-<containerName>`, so
# the engine (app `quality-copilot`, container `engine`) is `quality-copilot-engine`.
# This is inferred from the official sample (spl-pl-distribution proxies to
# `agv-monitor-backend` for app `agv-monitor`); confirm on a live instance —
# docs/SUPOS_INTEGRATION_CHECKLIST.md §8 item 2.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://quality-copilot-engine:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # HashRouter keeps client routes out of the request path, so every request
    # is a static asset or the shell — no server-side rewrite needed.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
