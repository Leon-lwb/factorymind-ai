# FactoryMind AI web — nginx site config.
#
# Serves the built SPA and reverse-proxies `/api` to the engine container, so
# the browser sees a single origin. `factorymind-engine` is the compose service
# name; rename it here if you rename the service.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames make these safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell must never be cached, or clients pin an old asset graph.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://factorymind-engine:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Client-side routes (React Router) fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}